name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test
      # Optional trusted signing: add repository secrets SIGN_PFX_BASE64 and SIGN_PFX_PASSWORD (a code-signing certificate from a public CA).
      - name: Prepare certificate
        if: ${{ env.HAS_CERT == 'true' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          "ADM_SIGN_PFX=$env:RUNNER_TEMP\sign.pfx" >> $env:GITHUB_ENV
          "ADM_SIGN_PASSWORD=$env:SIGN_PFX_PASSWORD" >> $env:GITHUB_ENV
        env:
          HAS_CERT: ${{ secrets.SIGN_PFX_BASE64 != '' }}
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
      - run: npm run release
      - run: npm run build:extensions
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          generate_release_notes: true
