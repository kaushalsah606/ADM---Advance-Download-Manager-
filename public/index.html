<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advance Download Manager</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{--bg:#f4f5f7;--panel:#fff;--line:#d9dce1;--text:#1d2330;--mute:#6b7280;--accent:#1769e0;--ok:#16874a;--err:#c62828;--sel:#dce9fb}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--panel:#1c2027;--line:#2d333d;--text:#e6e9ef;--mute:#98a1b0;--accent:#5b9bff;--sel:#233553;--ok:#4cc38a;--err:#ff6b6b}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:13px/1.4 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
#menubar{display:flex;gap:2px;padding:2px 8px;background:var(--panel);border-bottom:1px solid var(--line);position:relative}
#menubar>div{position:relative}
#menubar>div>button{border:0;background:none;padding:5px 10px}
.menu{display:none;position:absolute;left:0;top:100%;min-width:260px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:20;padding:4px}
#menubar>div:hover .menu,#menubar>div.open .menu{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 12px;border-radius:4px}
.menu button:hover{background:var(--sel)}.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
#toolbar .sp{flex:1}
#toolbar #bTurbo.on{background:linear-gradient(135deg,#ff9800,#ff3d00);color:#fff;border-color:#ff6d00;box-shadow:0 0 10px rgba(255,109,0,.6);font-weight:600}
#findbar{display:none;gap:6px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
#findbar.on{display:flex}#findbar input[type=text]{max-width:280px}
#banner{display:none;padding:6px 12px;background:#fff3cd;color:#664d03;border-bottom:1px solid var(--line)}
#main{flex:1;display:flex;min-height:0}
#side{width:210px;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:8px 0}
#side h4{margin:10px 14px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
#side div.n{padding:5px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
#side div.n.on,#side div.n:hover{background:var(--sel)}
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#tablewrap{flex:1;overflow:auto;background:var(--panel)}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--bg);text-align:left;font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
tr.sel td{background:var(--sel)}tr.hit td{outline:1px dashed var(--accent)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--accent)}
.st-complete{color:var(--ok)}.st-error{color:var(--err)}.st-paused,.st-queued{color:var(--mute)}
#detail{height:190px;border-top:1px solid var(--line);background:var(--panel);padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;align-content:start;overflow:auto}
#detail canvas{grid-column:1/3;width:100%;height:22px;border:1px solid var(--line);border-radius:4px}
#detail .k{color:var(--mute)}#detail .wide{grid-column:1/3}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:0;width:min(680px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form,dialog .box{padding:16px 18px;display:grid;gap:10px}
dialog h3{margin:0 0 4px}
#dAdd{width:min(640px,94vw)}
#fAdd{padding:12px 16px;gap:7px}
#fAdd h3{margin:0 0 2px;font-size:15px}
#fAdd .row{grid-template-columns:100px 1fr;gap:6px;font-size:13px}
#fAdd .row.chk{grid-template-columns:auto 1fr;margin-left:106px}
#fAdd .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#fAdd .two .row{grid-template-columns:78px 1fr}
#fAdd .auth label.chk{display:flex;align-items:center;gap:6px}
#fAdd input:not([type=checkbox]),#fAdd select,#fAdd textarea{padding:5px 8px;font-size:13px}
#fAdd textarea{resize:vertical;min-height:46px}
#fAdd .foot{margin-top:2px}
.row{display:grid;grid-template-columns:170px 1fr;gap:8px;align-items:center}
.row.chk{grid-template-columns:auto 1fr}
.row.info{grid-template-columns:170px 1fr}.row.info label{text-align:right}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -18px;padding:0 18px;flex-wrap:wrap}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none}.tabs button.on{border-color:var(--accent);color:var(--accent)}
.hint{color:var(--mute);font-size:12px}
#toast{position:fixed;right:16px;bottom:16px;background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;max-width:70vw;display:flex;gap:10px;align-items:center}
#toast.on{opacity:1;pointer-events:auto}
#toast button{padding:4px 12px;color:inherit;background:transparent;border:1px solid color-mix(in srgb,currentColor 45%,transparent);border-radius:6px;font-weight:600;cursor:pointer}
#toast button:hover{background:color-mix(in srgb,currentColor 18%,transparent);border-color:currentColor}
.grid{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0;padding:8px 10px;display:grid;gap:8px}legend{color:var(--mute);font-size:12px}
body.tb-small #toolbar .t{display:none}body.tb-text #toolbar .i{display:none}
body.neon{--accent:#00e5ff;--sel:#0b3a44;--bg:#0b0f14;--panel:#111821;--line:#1f3a46;--text:#d8f6ff}body.neon #toolbar button.primary{box-shadow:0 0 10px var(--accent);color:#001014}
@media(max-width:760px){#side{display:none}#detail{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="menubar"></div>
<div id="toolbar">
  <button class="primary" id="bAdd">+ Add URL</button>
  <button id="bStart">Start / Resume</button>
  <button id="bStop">Stop</button>
  <button id="bStopAll">Stop All</button>
  <button id="bDelete">Delete</button>
  <button id="bDelDone">Delete Completed</button>
  <button id="bOpts">Options</button>
  <button id="bSched">Scheduler</button>
  <button id="bQStart">Start Queue</button>
  <button id="bQStop">Stop Queue</button>
  <button id="bGrab">Grabber</button>
  <button id="bTurbo">Turbo</button>
  <span class="sp"></span><span id="total" class="hint"></span>
</div>
<div id="findbar">
  <span>Find:</span><input type="text" id="fText" placeholder="text">
  <select id="fScope" style="width:auto"><option value="name">File name</option><option value="desc">Description</option><option value="url">Site / link / parent page / referer</option></select>
  <label><input type="checkbox" id="fCase"> Match case</label><label><input type="checkbox" id="fWhole"> Whole string</label>
  <button id="fNext">Find next (F3)</button><button id="fClose">x</button>
</div>
<div id="banner"></div>
<div id="main">
  <div id="side"></div>
  <div id="center">
    <div id="tablewrap"><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div>
    <div id="detail"><span class="hint">Select a download to see segments and details.</span></div>
  </div>
</div>
<div id="toast"></div>
<div id="dyn"></div>

<!-- Add URL -->
<dialog id="dAdd"><form method="dialog" id="fAdd">
  <h3>Add new download</h3>
  <div class="row"><label>URL(s)</label><textarea name="url" rows="2" placeholder="https://…  ftp://…  or an .m3u8 stream (one per line)" required></textarea></div>
  <div id="probeInfo" class="hint"></div>
  <div id="zipList" class="hint" style="max-height:130px;overflow:auto"></div>
  <div class="row"><label>Save to</label><input name="saveDir" placeholder="Automatic (by category)"></div>
  <div class="row chk"><input type="checkbox" name="rememberPath" id="aRem"><label for="aRem">Remember this path for the category</label></div>
  <div class="two">
    <div class="row"><label>File name</label><input name="fileName" placeholder="Automatic"></div>
    <div class="row"><label>Category</label><select name="category"><option value="">Automatic</option></select></div>
  </div>
  <div class="two">
    <div class="row"><label>Referer</label><input name="referer"></div>
    <div class="row"><label>Description</label><input name="description"></div>
  </div>
  <div class="row auth"><label class="chk"><input type="checkbox" id="useAuth"> Authorization</label><span style="display:flex;gap:6px"><input name="username" placeholder="User" autocomplete="off"><input name="password" type="password" placeholder="Password" autocomplete="new-password"></span></div>
  <div class="foot"><button type="button" id="aPreview">Preview zip</button><button type="button" id="aProbe">Check file</button><button type="button" id="aCancel">Cancel</button><button type="button" id="aLater">Download later</button><button type="submit" class="primary" id="aStart">Start download</button></div>
</form></dialog>

<!-- Download video (quality list; opened when the browser's "Download this video" button or the menu is used) -->
<dialog id="dVideo" style="width:min(780px,96vw)"><div class="box">
  <h3 style="display:flex;gap:8px;align-items:center"><img src="/favicon.png" width="20" height="20" alt=""> <span id="vTitleBar">Download video</span></h3>
  <div id="vBody" style="display:grid;gap:10px;min-height:120px"></div>
  <div class="foot" style="justify-content:space-between">
    <span><button type="button" id="vLater" hidden>Download <u>L</u>ater</button></span>
    <span style="display:flex;gap:8px"><button type="button" class="primary" id="vStart" hidden>Download</button><button type="button" id="vCancel">Cancel</button></span>
  </div>
</div></dialog>

<!-- Download File Info (shown when a download is captured) -->
<dialog id="dInfo" style="width:min(720px,96vw)"><div class="box">
  <h3 style="display:flex;gap:8px;align-items:center"><img src="/favicon.png" width="20" height="20" alt=""> Download File Info</h3>
  <div style="display:grid;grid-template-columns:1fr 150px;gap:16px">
    <div style="display:grid;gap:9px;min-width:0">
      <div class="row info"><label>URL</label><input id="iUrl" readonly title=""></div>
      <div class="row info"><label>Category</label><span style="display:flex;gap:6px"><select id="iCat" style="flex:1"></select><button type="button" id="iCatAdd" title="New category" style="width:34px">+</button></span></div>
      <div class="row info"><label>Save As</label><span style="display:flex;gap:6px"><input id="iSave" style="flex:1"><button type="button" id="iBrowse" title="Choose a folder" style="width:40px">…</button></span></div>
      <fieldset style="margin-left:178px"><legend><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="iRem"><span>Remember this path for "<span id="iRemCat"></span>" category</span></label></legend>
        <input id="iDir"></fieldset>
      <div class="row info"><label>Description</label><input id="iDesc"></div>
      <div id="iWarn" class="hint" style="min-height:1.2em"></div>
    </div>
    <div style="text-align:center;display:grid;gap:8px;align-content:start;padding-top:6px">
      <div id="iIcon" style="font-size:58px;line-height:1.1">📁</div>
      <div id="iSize" style="font-weight:600">…</div>
      <div id="iType" class="hint"></div>
      <button type="button" id="iPreview">Preview</button>
    </div>
  </div>
  <div class="foot" style="justify-content:space-between">
    <span style="display:flex;gap:8px"><button type="button" id="iLater">Download <u>L</u>ater</button></span>
    <span style="display:flex;gap:8px"><button type="button" class="primary" id="iStart">Start Download</button><button type="button" id="fiCancel">Cancel</button></span>
  </div>
</div></dialog>

<!-- Options -->
<dialog id="dOpts"><div class="box">
  <h3>Options</h3>
  <div class="tabs" id="optTabs"></div>
  <div id="optBody" style="display:grid;gap:10px"></div>
  <div class="foot"><button id="oCancel">Cancel</button><button class="primary" id="oSave">Save</button></div>
</div></dialog>

<!-- Scheduler -->
<dialog id="dSched"><div class="box">
  <h3>Scheduler</h3>
  <div class="row"><label>Queue</label><span style="display:flex;gap:6px"><select id="qSel"></select><button id="qNew">New…</button><button id="qDel">Delete</button></span></div>
  <div id="qBody" style="display:grid;gap:10px"></div>
  <div class="foot"><button id="qClose">Close</button><button id="qStartNow">Start now</button><button id="qStopNow">Stop</button><button class="primary" id="qSave">Apply</button></div>
</div></dialog>

<!-- Grabber -->
<dialog id="dGrab"><div class="box">
  <h3>Site Grabber</h3>
  <div class="row"><label>Project name</label><input id="gName" placeholder="optional"></div>
  <div class="row"><label>Start page</label><input id="gUrl" placeholder="https://example.com/gallery/"></div>
  <div class="row"><label>Project template</label><span style="display:flex;gap:6px"><select id="gTpl"></select><button id="gSaveTpl" type="button">Save as template</button></span></div>
  <div class="row chk"><input type="checkbox" id="gAuth"><label for="gAuth">Use authorization</label></div>
  <div class="row"><label>Login / password</label><span style="display:flex;gap:6px"><input id="gUser"><input id="gPass" type="password"></span></div>
  <fieldset><legend>Where to search</legend>
    <div class="row chk"><input type="radio" name="gScope" id="gWhole"><label for="gWhole">Explore the whole site</label></div>
    <div class="row chk"><input type="radio" name="gScope" id="gLevels" checked><label for="gLevels">Explore the specified number of link levels</label></div>
    <div class="row"><label>Levels (this site / other)</label><span style="display:flex;gap:6px"><input id="gLv" type="number" value="2" min="0" max="10"><input id="gLvO" type="number" value="0" min="0" max="5"></span></div>
    <div class="row chk"><input type="checkbox" id="gNoParent"><label for="gNoParent">Don't explore parent directories</label></div>
    <div class="row chk"><input type="checkbox" id="gSub"><label for="gSub">Explore all sites within the main domain</label></div>
    <div class="row chk"><input type="checkbox" id="gJs" checked><label for="gJs">Process JavaScript (screens script text for links; nothing is executed)</label></div>
    <div class="row"><label>Don't explore (logout pages…)</label><input id="gLogout" placeholder="*logout*; */signout*"></div>
    <div class="row"><label>Explore only paths</label><input id="gIncPath" placeholder="optional; separate with ;"></div>
  </fieldset>
  <fieldset><legend>Which files to download</legend>
    <div class="row"><label>File types</label><span style="display:flex;gap:6px"><input id="gExt" placeholder="jpg,png"><select id="gFilter" style="width:auto"><option value="">Add filter…</option></select></span></div>
    <div class="row"><label>Exclude paths/domains</label><input id="gExc" placeholder="*/ads/*; *tracker*"></div>
    <div class="row"><label>File size (MB) min / max</label><span style="display:flex;gap:6px"><input id="gMin" type="number" min="0"><input id="gMax" type="number" min="0"></span></div>
    <div class="row chk"><input type="checkbox" id="gSame" checked><label for="gSame">Search files on this site only</label></div>
    <div class="row chk"><input type="checkbox" id="gDup"><label for="gDup">Hide duplicate files found in different locations</label></div>
  </fieldset>
  <fieldset><legend>Save and settings</legend>
    <div class="row chk"><input type="checkbox" id="gMirror"><label for="gMirror">Use original relative subfolders, save pages and convert links for offline browsing</label></div>
    <div class="row chk"><input type="checkbox" id="gOver"><label for="gOver">Overwrite existing files (otherwise a numbered name is used)</label></div>
    <div class="row"><label>Cookie header (manual login)</label><input id="gCookie" placeholder="log in with your browser, then paste its Cookie header"></div>
    <div class="row"><label>Explore at once (1-10)</label><input id="gConc" type="number" min="1" max="10" value="4"></div>
  </fieldset>
  <div class="hint" id="gStat"></div>
  <div class="grid"><table><tbody id="gFiles"></tbody></table></div>
  <div class="foot"><button id="gClose">Close</button><button id="gSched" type="button">Schedule…</button><button id="gSaveProj">Save project</button><button id="gStop">Stop</button><button id="gGo" class="primary">Start exploring</button><button id="gCheckAll">Check all</button><button id="gAdd">Add checked to list</button></div>
</div></dialog>

<!-- Import -->
<dialog id="dImp"><div class="box">
  <h3>Import downloads</h3>
  <input type="file" id="iFile" accept=".txt,.html,.htm,.csv,.log,.sgx,.json,.ief,.ef2">
  <textarea id="iText" rows="8" placeholder="Paste text or load a file – an .ief / .ef2 export, an Advance Download Manager export, or any text: all http(s)/ftp links are extracted"></textarea>
  <div class="foot"><button id="iCancel">Cancel</button><button class="primary" id="iOk">Add all to queue</button></div>
</div></dialog>

<script>
const TOKEN = '__TOKEN__';
const APP_VERSION = '__VERSION__';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let S = { downloads: [], categories: [], queues: [], settings: {}, projects: [] };
const dl = new Map();
let sel = new Set(), filter = { kind: 'all' };
const store = { get: (k, d) => { try { const v = localStorage.getItem('sg.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set: (k, v) => { try { localStorage.setItem('sg.' + k, JSON.stringify(v)); } catch { /* private mode */ } } };

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { toast(j.error || r.statusText); throw new Error(j.error || r.statusText); }
  return j;
}
function toast(m, actions = [], ms = 3500) {
  const t = $('#toast'); t.textContent = m;
  for (const a of actions) { const b = document.createElement('button'); b.textContent = a.label; b.onclick = () => { a.fn(); t.classList.remove('on'); }; t.append(b); }
  t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), actions.length ? 8000 : ms);
}
const fmtB = n => n == null ? '—' : n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';
// transfer rate: B/s below 1 KB, KB/s below 1 MB, MB/s below 1 GB, then GB/s
const fmtSpeed = n => { n = Math.max(0, +n || 0); return n < 1024 ? Math.round(n) + ' B/s' : n < 1048576 ? Math.round(n / 1024) + ' KB/s' : n < 1073741824 ? (n / 1048576).toFixed(2) + ' MB/s' : (n / 1073741824).toFixed(2) + ' GB/s'; };
const fmtT = s => s == null ? '' : s < 60 ? s + ' s' : s < 3600 ? Math.floor(s / 60) + 'm ' + (s % 60) + 's' : Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm';
const fmtD = t => t ? new Date(t).toLocaleString() : '';
function beep(freq) { try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = freq; g.gain.value = 0.05; o.connect(g); g.connect(c.destination); o.start(); setTimeout(() => { o.stop(); c.close(); }, 160); } catch { /* no audio */ } }

// ---- updates (installer build): never installs without a click ----
async function checkUpdate(manual) {
  let u;
  try { u = await api('GET', '/api/update/check'); } catch { u = { error: 'offline' }; }
  if (u.available) {
    const pick = await modal('Update available', '<div>Version <b>' + esc(u.latest) + '</b> is available (you have ' + esc(u.current) + ').</div><div class="hint" style="white-space:pre-wrap;max-height:160px;overflow:auto">' + esc(u.notes || '') + '</div><div class="hint">The installer is verified against the release checksums before it runs. The app restarts when done.</div>', [{ label: 'Later' }, { label: 'Install now', primary: true }]);
    if (pick === 'Install now') { try { await api('POST', '/api/update/install'); toast('Installing the update…'); } catch (e) { toast('Update failed: ' + e.message); } }
  } else if (manual) {
    modal('Check for updates', '<div>' + (u.error ? 'Could not check for updates: ' + esc(u.error) : 'You have the latest version (' + esc(u.current) + ').') + '</div>');
  }
}

// generic modal built on <dialog>
function modal(title, html, buttons = [{ label: 'Close' }]) {
  return new Promise(resolve => {
    const d = document.createElement('dialog');
    d.innerHTML = `<div class="box"><h3>${esc(title)}</h3><div class="body" style="display:grid;gap:10px">${html}</div><div class="foot"></div></div>`;
    const foot = d.querySelector('.foot');
    for (const b of buttons) {
      const el = document.createElement('button'); el.textContent = b.label; if (b.primary) el.className = 'primary';
      el.onclick = async () => { if (b.fn && (await b.fn(d)) === false) return; resolve(b.label); d.close(); };
      foot.append(el);
    }
    d.addEventListener('close', () => { d.remove(); resolve(null); });
    $('#dyn').append(d); d.showModal();
  });
}

// confirm() / prompt() would open the browser's own boxes ("127.0.0.1 says") in the native window: in-app dialogs instead
const uiConfirm = (message, okLabel = 'OK', title = 'Advance Download Manager') => modal(title, `<div>${esc(message)}</div>`, [{ label: 'Cancel' }, { label: okLabel, primary: true }]).then(r => r === okLabel);
function uiPrompt(message, value = '', title = 'Advance Download Manager') {
  let answer = null;

// the native window (src: host/Program.cs) answers a few questions the page cannot ask the system itself
const hostBridge = window.chrome && window.chrome.webview;
const hostWaiters = new Map(); let hostSeq = 0;
if (hostBridge) hostBridge.addEventListener('message', ev => { try { const m = JSON.parse(ev.data); const w = hostWaiters.get(m.id); if (w) { hostWaiters.delete(m.id); w(m); } } catch { /* not ours */ } });
const hostCall = (type, timeout = 900) => new Promise(resolve => {
  if (!hostBridge) return resolve(null);
  const id = ++hostSeq, t = setTimeout(() => { hostWaiters.delete(id); resolve(null); }, timeout);
  hostWaiters.set(id, m => { clearTimeout(t); resolve(m); });
  hostBridge.postMessage(JSON.stringify({ type, id }));
});
/** The web address on the clipboard (what you copied last), or ''. Native window: asked from the host; browser: only when the permission is already granted. */
async function clipboardUrl() {
  let t = '';
  const m = await hostCall('clipboard');
  if (m) t = m.text || '';
  else { try { const p = await navigator.permissions.query({ name: 'clipboard-read' }); if (p.state === 'granted') t = await navigator.clipboard.readText(); } catch { /* no permission: leave empty */ } }
  t = String(t || '').trim();
  return t.length < 2000 && /^(https?|ftp):\/\/\S+$/i.test(t) ? t : '';
}

// ---- columns / sorting / find ----
const COLS = [
  { id: 'name', label: 'File name', v: d => d.fileName, s: d => d.fileName.toLowerCase() },
  { id: 'q', label: 'Q', v: d => (S.queues.find(q => q.id === d.queue)?.type === 'sync' ? 'S' : d.queue ? 'Q' : ''), s: d => d.queue || '' },
  { id: 'size', label: 'Size', v: d => (d.sizeEstimated && d.size ? '~' : '') + fmtB(d.size), s: d => d.size ?? -1 },
  { id: 'progress', label: 'Progress', html: true, v: d => { const p = d.size ? Math.min(100, d.done / d.size * 100) : (d.status === 'complete' ? 100 : 0); return `<div class="bar"><i style="width:${p}%"></i></div>`; }, s: d => d.size ? d.done / d.size : 0 },
  { id: 'status', label: 'Status', cls: d => 'st-' + d.status, v: d => d.status === 'downloading' ? `Downloading${d.kind === 'hls' ? ' stream' : ''} (${d.conns}↯)` : d.status === 'error' ? 'Error: ' + d.error + (d.retryAt > Date.now() ? ' – retry in ' + Math.ceil((d.retryAt - Date.now()) / 1000) + 's' : '') : d.status, s: d => d.status },
  { id: 'speed', label: 'Transfer rate', v: d => d.speed ? fmtSpeed(d.speed) : '', s: d => d.speed },
  { id: 'eta', label: 'Time left', v: d => fmtT(d.eta), s: d => d.eta ?? 1e12 },
  { id: 'added', label: 'Added', v: d => fmtD(d.added), s: d => d.added },
  { id: 'lastTry', label: 'Last try date', v: d => fmtD(d.lastTry), s: d => d.lastTry || 0 },
  { id: 'desc', label: 'Description', v: d => d.description, s: d => d.description.toLowerCase() },
  { id: 'dir', label: 'Save to', v: d => d.saveDir, s: d => d.saveDir.toLowerCase() },
  { id: 'referer', label: 'Referer', v: d => d.referer || '', s: d => (d.referer || '').toLowerCase() },
  { id: 'parent', label: 'Parent web page', v: d => d.referer || '', s: d => (d.referer || '').toLowerCase() },
];
let cols = store.get('cols', ['name', 'q', 'size', 'progress', 'status', 'speed', 'eta', 'added']);
let sortBy = store.get('sort', { id: 'added', dir: -1 });
const find = { text: '', scope: 'name', cs: false, whole: false, pos: -1 };
function matches(d) {
  if (!find.text) return true;
  const hay = find.scope === 'name' ? d.fileName : find.scope === 'desc' ? d.description : [d.url, d.referer || ''].join(' ');
  const a = find.cs ? hay : hay.toLowerCase(), b = find.cs ? find.text : find.text.toLowerCase();
  return find.whole ? a === b : a.includes(b);
}

function visible() {
  let l = [...dl.values()];
  const f = filter;
  if (f.kind === 'unfinished') l = l.filter(d => d.status !== 'complete');
  else if (f.kind === 'finished') l = l.filter(d => d.status === 'complete');
  else if (f.kind === 'cat') l = l.filter(d => d.category === f.id);
  else if (f.kind === 'queue') l = l.filter(d => d.queue === f.id);
  l = l.filter(matches);
  const c = COLS.find(x => x.id === sortBy.id) || COLS[7];
  return l.sort((a, b) => { const x = c.s(a), y = c.s(b); return (x < y ? -1 : x > y ? 1 : 0) * sortBy.dir; });
}
function renderTurbo() {
  const on = !!(S.settings && S.settings.turbo), b = $('#bTurbo');
  b.classList.toggle('on', on);
  const t = b.querySelector('.t'); if (t) t.textContent = on ? 'Turbo ON' : 'Turbo';
  b.title = on ? 'Turbo mode is on: no speed limits, up to ' + S.settings.turboConnections + ' connections per download. Click to turn off.' : 'Turbo mode: remove all speed limits and use up to ' + S.settings.turboConnections + ' connections per download';
}
function renderAll() { renderSide(); renderHead(); renderRows(); renderDetail(); renderBanner(); renderTurbo(); checkPairs(); checkProposals(); checkVideoRequests(); }
function renderBanner() {
  const b = $('#banner'), w = S.quotaWaitUntil;

}

    '<h4>Categories</h4>' + S.categories.map(c => n('cat', c.id, c.name, all.filter(d => d.category === c.id).length)).join('') +
    '<h4>Queues</h4>' + S.queues.map(q => n('queue', q.id, (q.running ? '▶ ' : '') + q.name, all.filter(d => d.queue === q.id).length)).join('') +
    (S.projects.length ? '<h4>Grabber projects</h4>' + S.projects.map(p => `<div class="n" data-proj="${p.id}"><span>${p.running ? '▶ ' : p.schedule?.enabled ? '⏰ ' : ''}${esc(p.name)}</span></div>`).join('') : '');

function paintSeg(d) {
  const c = $('#seg'); if (!c) return; const x = c.getContext('2d'), W = c.width;
  x.fillStyle = getComputedStyle(document.body).getPropertyValue('--line'); x.fillRect(0, 0, W, 22);
  if (d.size) {
    x.fillStyle = '#2f80ed';
    if (d.status === 'complete') x.fillRect(0, 0, W, 22); else if (d.segments.length) d.segments.forEach(([s, p]) => x.fillRect(s / d.size * W, 0, Math.max(1, (p - s) / d.size * W), 22)); else x.fillRect(0, 0, d.done / d.size * W, 22);
    x.fillStyle = '#e8368f'; d.segments.forEach(([s]) => x.fillRect(s / d.size * W, 0, 2, 22));
  }
}

// ---- "Duplicate download link": what to do when a link is already in the download list ----
const dupStatus = d => d.status === 'complete' ? 'Complete' : d.status === 'downloading' ? 'Downloading' + (d.size ? ' (' + Math.floor(d.done / d.size * 100) + '%)' : '') : d.status === 'error' ? 'Error' : d.status === 'paused' ? 'Stopped' + (d.size ? ' (' + Math.floor(d.done / d.size * 100) + '%)' : '') : d.status === 'queued' ? 'Waiting' : d.status;
/** Resolves to { policy: 'number' | 'overwrite' | 'resume' } or null when cancelled. Also remembers the choice when asked to. */
function askDuplicate(existing) {
  const list = existing.filter(Boolean); if (!list.length) return Promise.resolve(null);
  const one = list[0], done = one.status === 'complete';
  const dot = one.fileName.lastIndexOf('.'), numbered = dot > 0 ? one.fileName.slice(0, dot) + '_2' + one.fileName.slice(dot) : one.fileName + '_2';
  const detail = list.length === 1
    ? `<div style="border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:3px">
         <div><b>${esc(one.fileName)}</b></div>
         <div class="hint" id="dupWhere">${esc(one.saveDir)}</div>
         <div class="hint">Status: ${esc(dupStatus(one))}${one.size != null ? ' · ' + fmtB(one.size) : ''}${one.added ? ' · added ' + esc(fmtD(one.added)) : ''}</div></div>`
    : `<div style="border:1px solid var(--line);border-radius:8px;padding:8px 10px" class="hint">${list.slice(0, 4).map(x => esc(x.fileName)).join('<br>')}${list.length > 4 ? '<br>… and ' + (list.length - 4) + ' more' : ''}</div>`;
  let chosen = null;
  return modal('Duplicate download link',
    `<div>${list.length === 1 ? 'This link is already in your download list.' : list.length + ' of these links are already in your download list.'} What do you want to do?</div>${detail}
     <label><input type="radio" name="dupc" value="number" checked> Add the duplicate with a numbered file name${list.length === 1 ? ' (<i>' + esc(numbered) + '</i>)' : ''}</label>
     <label><input type="radio" name="dupc" value="overwrite"> Add the duplicate and overwrite the existing file</label>
     <label><input type="radio" name="dupc" value="resume"> ${done ? 'Keep the existing file and do not download it again' : 'Resume the existing download'}</label>
     <label><input type="checkbox" id="dupRem"> Do not ask again: always do this (change in Options → Downloads)</label>`,
    [{ label: 'Cancel' }, { label: 'OK', primary: true, fn: async d => {
      const policy = d.querySelector('[name=dupc]:checked').value;
      chosen = { policy };
      if (d.querySelector('#dupRem').checked) await api('PUT', '/api/settings', { ...S.settings, duplicatePolicy: policy });
    } }]).then(() => chosen);
}
async function notifyDup(r) {
  const l = Array.isArray(r) ? r : [r]; const dups = l.filter(x => x.duplicate && !x.existing);
  if (!dups.length) return;
  const ans = await askDuplicate(dups);
  if (!ans) return;
  await api('POST', '/api/downloads', { urls: dups.map(x => x.url), duplicatePolicy: ans.policy, startNow: true, queue: null });
}

async function openCollect(id) {
  const c = await api('GET', '/api/collect/' + id);
  const isHtml = n => /\.(html?|php|aspx?|jsp)$/i.test(n) || !/\.[a-z0-9]{1,5}$/i.test(n), isImg = n => /\.(jpe?g|png|gif|bmp|webp|svg|ico)$/i.test(n);
  const cats = S.categories.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('');
  const render = d => {
    const hideHtml = d.querySelector('#cHtml').checked, hideImg = d.querySelector('#cImg').checked, hideRep = d.querySelector('#cRep').checked;
    const seen = new Set(), pat = d.querySelector('#cPat').value;
    d._rows = c.items.filter(i => !(hideHtml && isHtml(i.name)) && !(hideImg && isImg(i.name)) && !(hideRep && (seen.has(i.name) || !seen.add(i.name)))).map(i => {
      const ext = (i.name.match(/\.[^.]+$/) || [''])[0], base = i.name.slice(0, i.name.length - ext.length);
      return { ...i, fileName: pat.includes('*') ? pat.replace('*', base) + (pat.includes('.') ? '' : ext) : i.name };
    });
    d.querySelector('#cList').innerHTML = d._rows.map((r, k) => `<tr><td style="width:24px"><input type="checkbox" data-k="${k}" checked></td><td title="${esc(r.url)}">${esc(r.fileName)}</td><td class="hint">${esc(r.text)}</td></tr>`).join('');
  };
  const r = await new Promise(resolve => {
    const dlg = document.createElement('dialog');
    dlg.innerHTML = `<div class="box"><h3>Download all links (${c.items.length})</h3><div class="hint">${esc(c.title || c.referer)}</div>
      <div class="grid"><table><tbody id="cList"></tbody></table></div>
      <label><input type="checkbox" id="cHtml" checked> Hide HTML files</label><label><input type="checkbox" id="cImg"> Hide images located on this web page</label><label><input type="checkbox" id="cRep" checked> Hide repeated files</label>
      <div class="row"><label>Rename pattern (*)</label><input id="cPat" placeholder="e.g. holiday_* (optional)"></div>
      <div class="row"><label>Save to</label><select id="cWhere"><option value="auto">Every file to the directory of its category</option><option value="cat">All files to one category</option><option value="dir">All files to one directory</option></select></div>
      <div class="row"><label>Category / folder</label><span style="display:flex;gap:6px"><select id="cCat">${cats}</select><input id="cDir" placeholder="C:\\folder"></span></div>
      <label><input type="checkbox" id="cDesc"> Use link texts as download descriptions</label>
      <div class="foot"><button id="cAll">Check all</button><button id="cNone">Uncheck all</button><button id="cCancel">Cancel</button><button class="primary" id="cOk">OK</button></div></div>`;
    $('#dyn').append(dlg); dlg.showModal(); render(dlg);
    for (const i of ['#cHtml', '#cImg', '#cRep']) dlg.querySelector(i).onchange = () => render(dlg);
    dlg.querySelector('#cPat').oninput = () => render(dlg);
    dlg.querySelector('#cAll').onclick = () => dlg.querySelectorAll('#cList input').forEach(i => i.checked = true);
    dlg.querySelector('#cNone').onclick = () => dlg.querySelectorAll('#cList input').forEach(i => i.checked = false);
    dlg.querySelector('#cCancel').onclick = () => { dlg.close(); resolve(null); };
    dlg.querySelector('#cOk').onclick = () => { resolve(dlg); };
  });
  if (!r) return;
  const items = [...r.querySelectorAll('#cList input:checked')].map(i => r._rows[+i.dataset.k]).map(x => ({ url: x.url, fileName: x.fileName !== x.name ? x.fileName : undefined, description: r.querySelector('#cDesc').checked ? x.text : '' }));
  const where = r.querySelector('#cWhere').value;
  const res = await api('POST', `/api/collect/${id}/add`, { items, queue: 'main', category: where === 'cat' ? r.querySelector('#cCat').value : undefined, saveDir: where === 'dir' ? r.querySelector('#cDir').value : undefined });
  r.close(); r.remove(); toast(`${res.added} file(s) added to the queue`);
}

  File: [['Stop download', () => each(id => api('POST', `/api/downloads/${id}/stop`))], ['Remove', () => deleteSelected()], ['Download now', () => each(id => api('POST', `/api/downloads/${id}/start`))], ['Redownload', () => each(id => api('POST', `/api/downloads/${id}/redownload`))]],
  Downloads: [['Pause / stop all', () => api('POST', '/api/stop-all')], ['Turbo mode (on / off)', () => toggleTurbo()], '-', ['Delete all completed', () => $('#bDelDone').click()], '-', ['Find… (Ctrl-F)', () => { $('#findbar').classList.add('on'); $('#fText').focus(); }], ['Find next (F3)', findNext], '-', ['Scheduler', () => $('#bSched').click()], ['Start queue', () => $('#bQStart').click()], ['Stop queue', () => $('#bQStop').click()], '-', ['Speed Limiter on', () => limiter(true)], ['Speed Limiter off', () => limiter(false)], ['Speed Limiter settings…', () => { openOptions(); }], '-', ['Options', openOptions]],
  View: [['Columns…', columnsDialog], ['Toolbar › Customize…', toolbarDialog], ['Toolbar › Large buttons', () => setTb({ mode: 'large' })], ['Toolbar › Small buttons', () => setTb({ mode: 'small' })], ['Skin › Neon', () => setTb({ skin: 'neon' })], ['Skin › Default', () => setTb({ skin: 'default' })], ['Font…', fontDialog], ['Reset to default font', resetFont], ['Arrange files: click a column header', () => toast('Click a column header to sort; click again to reverse')], ['Toggle categories pane', () => { const s = $('#side'); s.style.display = s.style.display === 'none' ? '' : 'none'; }]],
  Help: [['Check for updates…', () => checkUpdate(true)], ['About Advance Download Manager', () => modal('About Advance Download Manager', '<div><b>Advance Download Manager</b> ' + esc(APP_VERSION) + '</div><div>Free and open source (MIT).</div><div class="hint">Created by @kaushalsah606 · github.com/kaushalsah606/ADM---Advance-Download-Manager-</div>')]],
};
async function limiter(on) { await api('PUT', '/api/settings', { ...S.settings, limiterOn: on }); toast('Speed Limiter ' + (on ? 'on' : 'off')); }
$('#menubar').innerHTML = Object.keys(MENUS).map(k => `<div><button>${k}</button><div class="menu">${MENUS[k].map((m, i) => m === '-' ? '<hr>' : `<button data-m="${k}:${i}">${esc(m[0])}</button>`).join('')}</div></div>`).join('');
$('#menubar').onclick = e => { const b = e.target.closest('button[data-m]'); if (!b) return; const [k, i] = b.dataset.m.split(':'); document.activeElement.blur(); MENUS[k][+i][1](); };

// ---- drag & drop links / clipboard monitor ----
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', async e => {
  e.preventDefault();
  const text = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
  const urls = (text.match(/\b(?:https?|ftp):\/\/[^\s"'<>]+/gi) || []);
  if (urls.length) { const r = await api('POST', '/api/downloads', { urls, startNow: false, queue: 'main' }); toast(`${urls.length} link(s) dropped into the queue`); notifyDup(r); }
});
let lastClip = '';
window.addEventListener('focus', async () => {
  if (!S.settings.clipboardMonitor || window.chrome?.webview) return;
  try {
    const t = (await navigator.clipboard.readText()).trim();
    if (t === lastClip || !/^(https?|ftp):\/\/\S+$/i.test(t)) return; lastClip = t;
    const ext = (new URL(t).pathname.split('.').pop() || '').toLowerCase();
    if ((S.settings.fileTypes || []).includes(ext)) { await api('POST', '/api/downloads', { url: t, startNow: true, queue: null }); toast('Started downloading the link from the clipboard'); }
  } catch { /* clipboard unavailable */ }
});

// ---- toolbar customization, skins ----
const TB_ICONS = { bAdd: '➕', bStart: '▶', bStop: '⏹', bStopAll: '⛔', bDelete: '🗑', bDelDone: '🧹', bOpts: '⚙', bSched: '⏰', bQStart: '⏩', bQStop: '⏸', bGrab: '🕷', bTurbo: '⚡' };
const TB_LABELS = {};
document.querySelectorAll('#toolbar button').forEach(b => {
  TB_LABELS[b.id] = b.textContent; b.title = b.textContent;
  b.innerHTML = `<span class="i">${TB_ICONS[b.id] || ''}</span> <span class="t">${esc(b.textContent)}</span>`;
});
let tb = Object.assign({ hidden: [], mode: 'large', skin: 'default' }, store.get('toolbar', {}));
function applyToolbar() {
  document.querySelectorAll('#toolbar button').forEach(b => { b.style.display = tb.hidden.includes(b.id) ? 'none' : ''; });
  document.body.classList.toggle('tb-small', tb.mode === 'small');
  document.body.classList.toggle('tb-text', tb.mode === 'text');
  document.body.classList.toggle('neon', tb.skin === 'neon');
}
function setTb(patch) { tb = { ...tb, ...patch }; store.set('toolbar', tb); applyToolbar(); }
function toolbarDialog() {
  const ids = Object.keys(TB_LABELS);
  modal('Customize toolbar', ids.map(id => `<label><input type="checkbox" data-id="${id}" ${tb.hidden.includes(id) ? '' : 'checked'}> ${esc(TB_ICONS[id] || '')} ${esc(TB_LABELS[id])}</label>`).join('') +
    `<div class="row"><label>Buttons</label><select id="tbMode"><option value="large" ${tb.mode === 'large' ? 'selected' : ''}>Large (icon + text)</option><option value="small" ${tb.mode === 'small' ? 'selected' : ''}>Small (icons only)</option><option value="text" ${tb.mode === 'text' ? 'selected' : ''}>Text only</option></select></div>
     <div class="row"><label>Skin</label><select id="tbSkin"><option value="default" ${tb.skin === 'default' ? 'selected' : ''}>Default</option><option value="neon" ${tb.skin === 'neon' ? 'selected' : ''}>Neon</option></select></div>`,
    [{ label: 'Reset', fn: () => setTb({ hidden: [], mode: 'large', skin: 'default' }) },
     { label: 'OK', primary: true, fn: d => setTb({ hidden: ids.filter(id => !d.querySelector(`[data-id="${id}"]`).checked), mode: d.querySelector('#tbMode').value, skin: d.querySelector('#tbSkin').value }) }]);
}
applyToolbar();

// ---- font ----
function applyFont() { const f = store.get('font', null); document.body.style.fontFamily = f ? f.family : ''; document.body.style.fontSize = f ? f.size + 'px' : ''; }
function fontDialog() {
  const f = store.get('font', null) || { family: 'system-ui', size: 13 };
  modal('Font', `<div class="row"><label>Family</label><select id="fFam">${['system-ui', 'Segoe UI', 'Arial', 'Verdana', 'Georgia', 'Consolas', 'monospace'].map(x => `<option ${x === f.family ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
    <div class="row"><label>Size (px)</label><input id="fSz" type="number" min="9" max="24" value="${f.size}"></div>`,
    [{ label: 'Cancel' }, { label: 'OK', primary: true, fn: d => { store.set('font', { family: d.querySelector('#fFam').value, size: +d.querySelector('#fSz').value || 13 }); applyFont(); } }]);
}
function resetFont() { store.set('font', null); applyFont(); toast('Default font restored'); }
applyFont();

setTimeout(() => { if (S?.settings?.updates?.check !== false) checkUpdate(false); }, 6000);

// ---- columns dialog with reordering ----
function columnsDialog() {
  let order = [...cols, ...COLS.map(c => c.id).filter(id => !cols.includes(id))];
  const on = new Set(cols);
  const dlg = document.createElement('dialog');
  dlg.innerHTML = `<div class="box"><h3>Columns</h3><div class="hint">Check the columns you want visible; use Move up / Move down to reorder them.</div><div id="colList" style="display:grid;gap:4px"></div>
    <div class="foot"><button id="colReset">Reset</button><button id="colCancel">Cancel</button><button class="primary" id="colOk">OK</button></div></div>`;
  const paint = () => {
    dlg.querySelector('#colList').innerHTML = order.map((id, i) => `<div style="display:flex;gap:6px;align-items:center"><label style="flex:1"><input type="checkbox" data-c="${id}" ${on.has(id) ? 'checked' : ''}> ${esc(COLS.find(x => x.id === id).label)}</label><button data-mv="${i}" data-dir="-1">Move up</button><button data-mv="${i}" data-dir="1">Move down</button></div>`).join('');
  };
  dlg.addEventListener('click', e => {
    const b = e.target.closest('[data-mv]'); if (!b) return;
    const i = +b.dataset.mv, j = i + +b.dataset.dir; if (j < 0 || j >= order.length) return;
    [order[i], order[j]] = [order[j], order[i]]; paint();
  });
  dlg.addEventListener('change', e => { const c = e.target.dataset.c; if (c) (e.target.checked ? on.add(c) : on.delete(c)); });
  dlg.querySelector('#colReset').onclick = () => { cols = ['name', 'q', 'size', 'progress', 'status', 'speed', 'eta', 'added']; store.set('cols', cols); dlg.close(); renderAll(); };
  dlg.querySelector('#colCancel').onclick = () => dlg.close();
  dlg.querySelector('#colOk').onclick = () => { cols = order.filter(id => on.has(id)); if (!cols.length) cols = ['name']; store.set('cols', cols); dlg.close(); renderAll(); };
  dlg.addEventListener('close', () => dlg.remove());
  $('#dyn').append(dlg); paint(); dlg.showModal();
}

// ---- interactive login (401) prompt ----
const askedAuth = new Set();
function maybeAskAuth(d) {
  if (d.status !== 'error' || d.authRealm == null || askedAuth.has(d.id + d.error)) return;
  askedAuth.add(d.id + d.error);
  let host = ''; try { host = new URL(d.url).hostname; } catch { /* keep empty */ }
  modal('Connecting to the site', `<div>${esc(host)} requires a user name and password.</div><div class="hint">Realm: ${esc(d.authRealm || '(none)')}</div>
    <div class="row"><label>User name</label><input id="auU"></div><div class="row"><label>Password</label><input id="auP" type="password"></div>
    <label><input type="checkbox" id="auS" checked> Save this password in the Site Logins list</label>`,
    [{ label: 'Cancel' }, { label: 'OK', primary: true, fn: async dlg => {
      const user = dlg.querySelector('#auU').value, pass = dlg.querySelector('#auP').value;
      if (!user) return false;
      await api('PATCH', `/api/downloads/${d.id}`, { username: user, password: pass });
      if (dlg.querySelector('#auS').checked) await api('PUT', '/api/settings', { ...S.settings, siteLogins: [...(S.settings.siteLogins || []), { pattern: host, user, pass }] });
      await api('POST', `/api/downloads/${d.id}/start`);
    } }]);
}

// ---- scheduler "Shut down" countdown ----
es.addEventListener('shutdown-pending', e => {
  const { seconds } = JSON.parse(e.data); let left = seconds;
  const dlg = document.createElement('dialog');
  dlg.innerHTML = `<div class="box"><h3>Shut down</h3><div>Advance Download Manager has finished queue processing. According to the scheduler settings your computer is shutting down in <b id="sdLeft">${left}</b> s.</div>
    <div class="bar"><i id="sdBar" style="width:100%"></i></div><div class="foot"><button id="sdCancel">Cancel</button><button class="primary" id="sdNow">Shut down now</button></div></div>`;
  $('#dyn').append(dlg); dlg.showModal();
  const t = setInterval(() => { left--; dlg.querySelector('#sdLeft').textContent = Math.max(0, left); dlg.querySelector('#sdBar').style.width = Math.max(0, left) / seconds * 100 + '%'; if (left <= 0) dlg.close(); }, 1000);
  dlg.addEventListener('close', () => { clearInterval(t); dlg.remove(); });
  dlg.querySelector('#sdCancel').onclick = () => { api('POST', '/api/shutdown-cancel'); dlg.close(); toast('Shut down cancelled'); };
  dlg.querySelector('#sdNow').onclick = () => { api('POST', '/api/shutdown-now'); dlg.close(); };
});

setInterval(() => { if ([...dl.values()].some(d => d.status === 'error' && d.retryAt > Date.now()) || S.quotaWaitUntil > Date.now()) { renderRows(); renderBanner(); } }, 1000);
</script>
</body>
